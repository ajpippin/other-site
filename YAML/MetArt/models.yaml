    Bio: My name is Val Eriia, and modeling is a way for me to express both beauty and inner balance. Alongside my career, I'm passionate about osteopathy, different physical practices, and psychology - they help me stay connected with myself and with others on a deeper level. For eight years I lived as a vegan, and even now my taste remains the same - I truly enjoy fresh, simple, and juicy food like fruits, vegetables, and greens. Sports have always been part of my life. I've tried everything from badminton to weightlifting, and today Pilates is my main practice - it keeps me strong, flexible, and mindful. I consider myself a person of mood&colon; sometimes I choose cozy evenings at home or quality time with loved ones, and other times I love to dive into the energy of a vibrant party. I also adore traveling, especially to warm countries like Spain and Portugal, where I would love to live for a few months. Music is my daily fuel. My playlist is diverse, but I usually prefer tracks that move me, inspire me to dance, and give me energy for the whole day. For me, modeling is not only about appearance - it's about living in harmony, staying true to myself, and sharing that energy with the world.
