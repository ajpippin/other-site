<h2>Static search &amp; Static content</h2>

<table id="details">
    <tbody>
    <tr>
        <td class="keyword">Country</td>
        <td class="autocomplete" style="width:300px;"><input id="country" type="text" name="myCountry" placeholder=""/></td>
    </tr>
    <tr>
        <td class="keyword">State</td>
        <td class="autocomplete" style="width:300px;"><input id="state" type="text" name="myState" placeholder=""/></td>
    </tr>
    </tbody>
    <tfoot>
    <tr>
        <td>&nbsp;</td>
        <td style="text-align: center; padding-top: 10px;"><input value="Update" type="submit"></td>
    </tr>
    </tfoot>
</table>

<script src="js/countries.js">//</script>
<script src="js/states.js">//</script>

<script>
    /*initiate the autocomplete function on the "myInput" element, and pass along the countries array as possible autocomplete values:*/
    autocomplete(document.getElementById("country"), countries);
    autocomplete(document.getElementById("state"), states);
</script>

</body>
</html>
