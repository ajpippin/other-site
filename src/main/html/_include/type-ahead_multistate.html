<!DOCTYPE html>
<html>
<head>
    <title>Multi-state</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/HTML/css/autocomplete.css" />
    <link rel="stylesheet" href="/HTML/css/details.css" />
    <script src="/HTML/js/autocomplete.js">//</script>
</head>
<body>
[ <a href="type-ahead_staticSearch_staticContent.html">static/static</a>
| <a href="type-ahead_staticSearch_dynamicContent.html">static/dynamic</a>
| <a href="type-ahead_multistate.html">refresh</a>
]<br/>

<h2>Multi-state</h2>

<table id="details">
    <tbody>
        <tr>
            <td class="keyword"><label for="country">Country</label></td>
            <td class="autocomplete" style="width:300px;"><input id="country" type="text" name="myCountry" placeholder=""/></td>
        </tr>
        <tr>
            <td class="keyword"><label for="state">State</label></td>
            <td class="autocomplete" style="width:300px;"><input id="state" type="text" name="myState" placeholder=""/></td>
        </tr>
        <tr id="statelistTR">
            <td style="border; thin solid green;">&nbsp;</td>
            <td style="border; thin solid red;"><div id="stateDiv"></div></td>
        </tr>
    </tbody>
    <tfoot>
    <tr>
        <td>&nbsp;</td>
        <td class="submit"><button id="submit" type="button" onclick="return submitChanges();">Submit Changes</button></td>
<!--        <td id="submit"><input value="Update" type="submit"></td>-->
    </tr>
    </tfoot>
</table>

<script src="/HTML/js/countries.js">//</script>
<script src="/HTML/js/states.js">//</script>

<script>
    var statelist = ["CA","UT"];
    /*initiate the autocomplete function on the "myInput" element, and pass along the countries array as possible autocomplete values:*/
    autocomplete(document.getElementById("country"), countries);
    autocomplete(document.getElementById("state"), states,
        document.getElementById("statelistTR"),document.getElementById("stateDiv"), statelist);
</script>

</body>
</html>
